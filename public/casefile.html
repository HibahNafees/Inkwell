<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CaseFile: a detective game with 20 fictional mysteries.">
<title>CaseFile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: a night-desk console. Sticky case bar on top, numbered investigation index down the left,
   working surface on the right. Findings are manila paper slips; verdicts are rubber stamps. */
:root {
  --desk: #10161c;
  --panel: #161e27;
  --panel-2: #1d2731;
  --line: #2a3643;
  --ink: #e6e1d4;
  --muted: #98a2ad;
  --paper: #e3d2a4;
  --paper-2: #d8c48f;
  --paper-ink: #2b2519;
  --paper-muted: #6b5c3a;
  --red: #d8604a;
  --red-soft: rgba(216, 96, 74, .14);
  --brass: #d1a95c;
  --brass-soft: rgba(209, 169, 92, .14);
  --ok: #72c290;
  --ok-soft: rgba(114, 194, 144, .14);
  --shadow: 0 1px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.28);
  --f-display: "Special Elite", "Courier New", Courier, monospace;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --desk: #dde2e6; --panel: #f3f5f6; --panel-2: #e8ecef; --line: #c5cdd4;
    --ink: #1a222b; --muted: #55606c;
    --paper: #ecdcaf; --paper-2: #e0cb90; --paper-ink: #2b2519; --paper-muted: #6b5c3a;
    --red: #b13e29; --red-soft: rgba(177, 62, 41, .10);
    --brass: #876522; --brass-soft: rgba(135, 101, 34, .12);
    --ok: #2d7a4a; --ok-soft: rgba(45, 122, 74, .10);
    --shadow: 0 1px 0 rgba(20,30,40,.06), 0 6px 18px rgba(20,30,40,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --desk: #dde2e6; --panel: #f3f5f6; --panel-2: #e8ecef; --line: #c5cdd4;
  --ink: #1a222b; --muted: #55606c;
  --paper: #ecdcaf; --paper-2: #e0cb90; --paper-ink: #2b2519; --paper-muted: #6b5c3a;
  --red: #b13e29; --red-soft: rgba(177, 62, 41, .10);
  --brass: #876522; --brass-soft: rgba(135, 101, 34, .12);
  --ok: #2d7a4a; --ok-soft: rgba(45, 122, 74, .10);
  --shadow: 0 1px 0 rgba(20,30,40,.06), 0 6px 18px rgba(20,30,40,.10);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 22px; letter-spacing: .02em; background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 26px; height: 26px; border: 2px solid var(--red); border-radius: 50%; display: grid; place-items: center; color: var(--red); font-size: 13px; transform: rotate(-8deg); }
.case-chip { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
.case-chip .num { color: var(--red); font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; }
.case-chip .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.mini-prog { width: 110px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.mini-prog i { display: block; height: 100%; background: var(--brass); }
.save { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.icon-btn:hover { border-color: var(--brass); }

/* Layout */
.layout { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 32px; }
.layout.solo { grid-template-columns: minmax(0, 1fr); }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; display: grid; gap: 18px; }
.nav-group { display: grid; gap: 2px; }
.nav-group .label { padding: 0 10px 6px; }
.nav-btn { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 10px; color: var(--muted); font-size: 14px; }
.nav-btn .n { font-family: var(--f-mono); font-size: 11px; opacity: .8; }
.nav-btn:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
.nav-btn.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--red); }
.nav-btn.seen .n { color: var(--brass); opacity: 1; }
.nav-btn:disabled { opacity: .45; cursor: not-allowed; }
.pip { font-family: var(--f-mono); font-size: 10px; background: var(--red); color: var(--desk); border-radius: 8px; padding: 0 6px; font-weight: 600; }
.lock { font-size: 11px; }
.main { min-width: 0; display: grid; gap: 24px; align-content: start; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 14px 64px; }
  .side { position: static; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .nav-group { display: flex; gap: 4px; }
  .nav-group .label { display: none; }
  .nav-btn { display: flex; white-space: nowrap; padding: 7px 10px; background: var(--panel); }
  .nav-btn.on { box-shadow: inset 0 -2px 0 var(--red); }
  .mini-prog { display: none; }
  .case-chip { order: 3; flex-basis: 100%; }
}

/* Section header */
.sec-head { display: grid; gap: 6px; }
.sec-head h1 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 36px); font-weight: 400; }
.sec-head p { color: var(--muted); max-width: 64ch; }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff8f0; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--red); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 13px; }

/* Paper slips */
.paper { background: var(--paper); color: var(--paper-ink); border-radius: 3px; padding: 16px 18px; box-shadow: var(--shadow);
  background-image: repeating-linear-gradient(to bottom, transparent 0 25px, rgba(107, 92, 58, .14) 25px 26px); }
.paper .label { color: var(--paper-muted); }
.paper h3 { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.paper.key { box-shadow: var(--shadow), inset 0 0 0 2px rgba(177, 62, 41, .0); }
.slip-src { font-family: var(--f-mono); font-size: 11px; color: var(--paper-muted); }

.stamp { display: inline-block; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--red); border: 2px solid var(--red); border-radius: 4px; padding: 2px 10px; transform: rotate(-3deg); font-size: 13px; }
.stamp.ok { color: var(--ok); border-color: var(--ok); }
.stamp.brass { color: var(--brass); border-color: var(--brass); }
.stamp.big { font-size: clamp(28px, 6vw, 48px); padding: 6px 22px; border-width: 4px; }

.tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.red { color: var(--red); border-color: var(--red); background: var(--red-soft); }
.tag.brass { color: var(--brass); border-color: var(--brass); background: var(--brass-soft); }
.tag.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

/* Library */
.hero { display: grid; gap: 12px; padding-block: 12px 4px; }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 8vw, 72px); letter-spacing: -.01em; line-height: 1; }
.hero p { color: var(--muted); max-width: 58ch; font-size: 16px; }
.flow { display: flex; flex-wrap: wrap; gap: 6px 4px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.flow span:not(:last-child)::after { content: "→"; margin-left: 6px; color: var(--brass); }
.folder { position: relative; padding-top: 22px; }
.folder-tab { position: absolute; top: 0; left: 18px; background: var(--paper-2); color: var(--paper-ink); font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 3px 14px 6px; border-radius: 6px 6px 0 0; letter-spacing: .06em; }
.folder-body { background: var(--paper); color: var(--paper-ink); border-radius: 0 6px 6px 6px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 12px; height: 100%; align-content: start; }
.folder-body h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.folder-body .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.folder-body .tag { color: var(--paper-muted); border-color: rgba(107,92,58,.4); }
.folder-body .btn { background: rgba(255,255,255,.35); border-color: rgba(107,92,58,.35); color: var(--paper-ink); }
.folder-body .btn.primary { background: #2b2519; border-color: #2b2519; color: #efe3c0; }
.folder-body .prog { height: 5px; background: rgba(107,92,58,.2); border-radius: 3px; overflow: hidden; }
.folder-body .prog i { display: block; height: 100%; background: #b13e29; }
.folder .stamp { position: absolute; right: 16px; top: 34px; background: var(--paper); }

/* Dashboard */
.dash-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: start; }
.big-prog { display: grid; gap: 8px; }
.big-prog .track { height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
.big-prog .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--red)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.tile:hover { border-color: var(--brass); }
.tile .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile h3 { font-size: 16px; }
.tile p { color: var(--muted); font-size: 13px; }
.next { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 3px solid var(--red); }

/* Brief */
.brief-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .brief-grid, .dash-head { grid-template-columns: minmax(0, 1fr); } }
.prose { display: grid; gap: 12px; max-width: 66ch; font-size: 16px; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.dl dt { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--paper-muted); padding-top: 3px; }
.dl dd { margin: 0; }
ul.facts { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

/* Suspects */
.suspect { display: grid; gap: 12px; align-content: start; }
.suspect-top { display: flex; gap: 14px; align-items: center; }
.mug { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; background: var(--panel-2); border: 2px solid var(--line); color: var(--brass); }
.suspect h3 { font-size: 18px; }
.kv { display: grid; gap: 8px; font-size: 14px; }
.kv div { display: grid; gap: 1px; }
.linked { display: flex; flex-wrap: wrap; gap: 6px; }

/* Locations & interviews */
.picker { display: flex; gap: 8px; flex-wrap: wrap; }
.pick { border: 1px solid var(--line); background: var(--panel); border-radius: 20px; padding: 6px 14px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.pick.on { background: var(--ink); color: var(--desk); border-color: var(--ink); }
.pick .c { font-family: var(--f-mono); font-size: 11px; opacity: .75; }
.spot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 0; border-top: 1px solid var(--line); }
.spot:first-child { border-top: 0; padding-top: 0; }
.spot h3 { font-size: 15px; }
.found { margin-top: 8px; font-size: 14px; }
.clue-chip { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; background: var(--paper); color: var(--paper-ink); padding: 3px 10px; border-radius: 2px; font-weight: 600; }
.transcript { display: grid; gap: 14px; }
.qa { display: grid; gap: 4px; }
.qa .q { font-family: var(--f-mono); font-size: 13px; color: var(--brass); }
.qa .a { padding-left: 14px; border-left: 2px solid var(--line); }
.qbtn { text-align: left; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.qbtn:hover { border-color: var(--brass); border-style: solid; }
.qbtn.confront { border-color: var(--red); }

/* Evidence */
.exhibit { display: grid; gap: 10px; align-content: start; position: relative; }
.exhibit.locked { opacity: .6; border-style: dashed; }
.exhibit h3 { font-size: 16px; }
.exhibit .detail { font-size: 14px; background: var(--panel-2); border-radius: 6px; padding: 10px 12px; white-space: pre-line; }

/* Timeline */
.tl { display: grid; gap: 0; position: relative; }
.tl-item { display: grid; grid-template-columns: 64px 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding-block: 10px; }
.tl-item .t { font-family: var(--f-mono); font-size: 14px; padding-top: 1px; text-align: right; font-variant-numeric: tabular-nums; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brass); margin-top: 5px; position: relative; justify-self: center; }
.tl-item:not(:last-child) .tl-dot::after { content: ""; position: absolute; left: 5px; top: 14px; width: 2px; height: calc(100% + 36px); background: var(--line); }
.tl-item.claim .tl-dot { background: var(--panel); border: 2px solid var(--brass); }
.tl-item.flagged .tl-dot { background: var(--red); border-color: var(--red); }
.tl-item .src { font-size: 12px; color: var(--muted); }
.flag-btn { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 3px 9px; font-size: 12px; white-space: nowrap; }
.flag-btn.on { border-color: var(--red); color: var(--red); background: var(--red-soft); }
@media (max-width: 560px) { .tl-item { grid-template-columns: 50px 14px minmax(0, 1fr); } .tl-item .flag-btn { grid-column: 3; justify-self: start; } }

/* Board */
.board-wrap { background: var(--panel-2); border-radius: 10px; overflow-x: auto; }
.board { display: block; width: 100%; min-width: 520px; height: auto; }
.board .string { stroke: var(--red); stroke-width: 2; fill: none; opacity: .85; }
.board .node { stroke: var(--desk); stroke-width: 2; }
.board .nlabel { fill: var(--ink); font-family: var(--f-body); font-size: 12px; }
.board .elabel { fill: var(--brass); font-family: var(--f-mono); font-size: 10px; }
.conn-form { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 760px) { .conn-form { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 4px; }
.field select, .field input, .field textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
.conn-list { display: grid; gap: 6px; }
.conn { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--panel-2); border-radius: 6px; font-size: 14px; flex-wrap: wrap; }
.conn .via { font-family: var(--f-mono); font-size: 12px; color: var(--brass); }

/* Notes */
.notepad { width: 100%; min-height: 380px; resize: vertical; border: 0; border-radius: 3px; padding: 18px 20px; line-height: 26px; font-family: var(--f-mono); font-size: 14px;
  background: var(--paper); color: var(--paper-ink);
  background-image: linear-gradient(to right, transparent 36px, rgba(177,62,41,.35) 36px 37px, transparent 37px), repeating-linear-gradient(to bottom, transparent 0 25px, rgba(107,92,58,.2) 25px 26px);
  background-attachment: local; padding-left: 50px; box-shadow: var(--shadow); }

/* Theory */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.choice { position: relative; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--panel-2); cursor: pointer; font-size: 14px; }
.choice input { margin-top: 3px; accent-color: var(--red); }
.choice:has(input:checked) { border-color: var(--red); background: var(--red-soft); }
.choice.dis { opacity: .5; }
.warn { border-left: 3px solid var(--brass); padding: 10px 14px; background: var(--brass-soft); border-radius: 0 6px 6px 0; font-size: 14px; }

/* Verdict & score */
.verdict-head { display: grid; justify-items: start; gap: 14px; }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp th, .cmp td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.cmp th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.mark-ok { color: var(--ok); font-weight: 700; }
.mark-no { color: var(--red); font-weight: 700; }
.tbl-wrap { overflow-x: auto; }
.score-total { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.score-total b { font-family: var(--f-mono); font-size: clamp(44px, 8vw, 64px); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.pts { font-family: var(--f-mono); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.proof { display: grid; gap: 10px; }
.proof-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }

/* Toasts */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: grid; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--paper); color: var(--paper-ink); padding: 10px 14px; border-radius: 3px; box-shadow: var(--shadow); font-size: 14px; display: grid; gap: 2px; animation: slip .35s ease-out; }
.toast .label { color: var(--paper-muted); }
.toast.ev { background: var(--panel); color: var(--ink); border: 1px solid var(--brass); }
.toast.ev .label { color: var(--brass); }
@keyframes slip { from { transform: translateY(12px) rotate(-1deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes thud { 0% { transform: scale(1.6) rotate(-10deg); opacity: 0; } 70% { transform: scale(.96) rotate(-4deg); opacity: 1; } 100% { transform: rotate(-4deg); } }
.stamp.big.anim { animation: thud .45s ease-out both; }
@media (prefers-reduced-motion: reduce) { .toast, .stamp.big.anim { animation: none; } }
.confirm-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>

      { clue: "cable_order", text: "The same cable was delivered to Nell." },
      { clue: "keycard", text: "She was alone in Studio B before the show, although she denies it." },
      { clue: "rota_change", text: "She removed the engineer who would have checked the studio." },
      { clue: "running_order", text: "Vince was about to reveal the missing money." },
      { clue: "appeal_cash", text: "Nell withdrew the £80,000." },
      { clue: "bobbie_live", text: "Bobbie was live on air elsewhere." },
      { clue: "martin_reception", text: "Martin never got past reception." }
    ]
  }
}
);
CASES.forEach(c => {
  if (!c.par) {
    const n = c.locations.reduce((a, l) => a + l.spots.length, 0) + Object.values(c.interviews).flat().length + c.evidence.filter(e => e.detail).length;
    c.par = Math.round(n * 0.7);
  }
});

/* ------------------------------------------------------------------ */
/* SECTIONS                                                             */
/* ------------------------------------------------------------------ */
const GROUPS = [
  { label: 'Case', items: [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'brief', label: 'Case brief' } ] },
  { label: 'Investigate', items: [
    { id: 'suspects', label: 'Suspects' },
    { id: 'locations', label: 'Locations' },
    { id: 'interviews', label: 'Interviews' },
    { id: 'evidence', label: 'Evidence' },
    { id: 'clues', label: 'Clues' },
    { id: 'timeline', label: 'Timeline' },
    { id: 'connections', label: 'Connections' },
    { id: 'notes', label: 'Notes' },
    { id: 'hints', label: 'Hints' } ] },
  { label: 'Close the case', items: [
    { id: 'theory', label: 'Final theory' },
    { id: 'verdict', label: 'Verdict', gated: true },
    { id: 'solution', label: 'Solution', gated: true },
    { id: 'score', label: 'Detective score', gated: true } ] }
];
const FLOW = ['brief', 'suspects', 'locations', 'interviews', 'evidence', 'clues', 'timeline', 'connections', 'notes'];
const SECTION_INFO = {
  brief: 'The story, the victim and the known facts.',
  suspects: 'Profiles, motives and alibis.',
  locations: 'Search the scenes for clues.',
  interviews: 'Question each suspect.',
  evidence: 'Physical and digital exhibits.',
  clues: 'Everything you’ve found so far.',
  timeline: 'Events in order. Flag what doesn’t fit.',
  connections: 'Pin strings between people and facts.',
  notes: 'Your own theories and observations.',
  hints: 'Help when you’re stuck, at a cost.',
  theory: 'Name the culprit and prove it.'
};
const PTS = { culprit: 400, motive: 150, perKey: 100, discovery: 150, timeline: 50, perConn: 25, efficiency: 100, hint: 40 };
const STORE_KEY = 'casefile.v1';

/* ------------------------------------------------------------------ */
/* STATE                                                                */
/* ------------------------------------------------------------------ */
let S;
let storageOk = true;
let savedAt = null;
const ui = { confirm: null };

function freshState() { return { v: 1, theme: 'dark', view: 'library', caseId: null, section: 'dashboard', loc: {}, who: {}, cases: {} }; }
function freshCase() { return { visited: {}, clues: [], searched: {}, asked: {}, examined: {}, actions: 0, notes: '', connections: [], flags: {}, hints: 0, draft: { culprit: '', motive: '', evidence: [], explain: '' }, theory: null, revealed: false, started: Date.now() }; }
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.v === 1) return Object.assign(freshState(), d); } }
  catch (e) { storageOk = false; }
  return freshState();
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOk = true; savedAt = new Date(); }
    catch (e) { storageOk = false; }
    const el = document.getElementById('save'); if (el) el.textContent = saveLabel();
  }, 150);
}
function saveLabel() {
  if (!storageOk) return 'Saving off in this browser';
  if (!savedAt) return 'Progress saves automatically';
  return 'Saved ' + savedAt.toTimeString().slice(0, 5);
}

const C = () => CASES.find(c => c.id === S.caseId);
function CS(id) { id = id || S.caseId; if (!S.cases[id]) S.cases[id] = freshCase(); return S.cases[id]; }
const reqList = r => !r ? [] : Array.isArray(r) ? r : [r];
const has = (cs, r) => reqList(r).every(x => cs.clues.includes(x));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const initials = n => n.replace(/^Dr\.\s*/, '').split(/\s+/).map(w => w[0]).join('').slice(0, 2);

function unlockedEvidence(c, cs) { return c.evidence.filter(e => has(cs, e.requires)); }
function knownEvents(c, cs) { return c.timeline.map((e, i) => ({ ...e, i })).filter(e => has(cs, e.requires)); }
function totalClues(c) { return Object.keys(c.clues).length; }
function progress(c, cs) {
  const visited = FLOW.filter(s => cs.visited[s]).length / FLOW.length;
  const found = cs.clues.length / totalClues(c);
  return Math.round(visited * 25 + found * 75);
}
function newCounts(c, cs) {
  const locs = c.locations.reduce((n, l) => n + l.spots.filter(sp => !cs.searched[l.id + ':' + sp.id] && has(cs, sp.requires)).length, 0);
  const qs = Object.values(c.interviews).flat().filter(q => !cs.asked[q.id] && has(cs, q.requires)).length;
  const ev = unlockedEvidence(c, cs).filter(e => e.detail && !cs.examined[e.id]).length;
  return { locations: locs, interviews: qs, evidence: ev };
}

/* ------------------------------------------------------------------ */
/* ACTIONS                                                              */
/* ------------------------------------------------------------------ */
function toast(label, text, cls) {
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + (cls || '');
  t.innerHTML = '<span class="label">' + esc(label) + '</span><span>' + esc(text) + '</span>';
  box.appendChild(t);
  setTimeout(() => t.remove(), 4200);
  while (box.children.length > 4) box.firstChild.remove();
}
function discover(id) {
  const c = C(), cs = CS();
  if (!id || cs.clues.includes(id)) return;
  const evBefore = unlockedEvidence(c, cs).map(e => e.id);
  cs.clues.push(id);
  toast('New clue', c.clues[id].title);
  unlockedEvidence(c, cs).filter(e => !evBefore.includes(e.id)).forEach(e => toast('Evidence recovered', e.name, 'ev'));
}
function act(cs) { cs.actions += 1; }

function go(section) {
  S.section = section; ui.confirm = null;
  if (S.view === 'case') CS().visited[section] = true;
  save(); render(); window.scrollTo(0, 0);
}
function openCase(id) {
  S.view = 'case'; S.caseId = id;
  const cs = CS();
  S.section = cs.theory ? 'verdict' : 'dashboard';
  cs.visited[S.section] = true;
  ui.confirm = null; save(); render(); window.scrollTo(0, 0);
}
function replay(id) {
  S.cases[id] = freshCase(); delete S.loc[id]; delete S.who[id];
  openCase(id);
  toast('Case reopened', 'All findings cleared. Good hunting.', 'ev');
}

function scoreOf(c, cs) {
  const t = cs.theory, sol = c.solution;
  const culprit = t.culprit === sol.culprit ? PTS.culprit : 0;
  const motive = t.motive === sol.motive ? PTS.motive : 0;
  const keyHits = t.evidence.filter(id => sol.keyClues.includes(id)).length;
  const evidence = Math.min(3, keyHits) * PTS.perKey;
  const discovery = Math.round(PTS.discovery * cs.clues.length / totalClues(c));
  const timeline = c.timeline.some((e, i) => e.key && cs.flags[i]) ? PTS.timeline : 0;
  const culpritNode = 's:' + sol.culprit;
  const isKeyNode = n => (n.startsWith('c:') && sol.keyClues.includes(n.slice(2))) ||
    (n.startsWith('e:') && (() => { const e = c.evidence.find(x => x.id === n.slice(2)); return e && (sol.keyClues.includes(e.clue) || reqList(e.requires).some(r => sol.keyClues.includes(r))); })());
  const goodConns = cs.connections.filter(k => (k.a === culpritNode && isKeyNode(k.b)) || (k.b === culpritNode && isKeyNode(k.a))).length;
  const conns = Math.min(3, goodConns) * PTS.perConn;
  const over = Math.max(0, cs.actions - c.par);
  const efficiency = Math.max(0, Math.round(PTS.efficiency * (1 - over / c.par)));
  const hints = -cs.hints * PTS.hint;
  const total = Math.max(0, culprit + motive + evidence + discovery + timeline + conns + efficiency + hints);
  const solved = culprit && motive && keyHits >= 2 ? 'solved' : culprit ? 'partial' : 'unsolved';
  return { culprit, motive, evidence, keyHits, discovery, timeline, conns, goodConns, efficiency, hints, total, solved };
}
function rank(total) {
  if (total >= 1000) return 'Chief Inspector';
  if (total >= 800) return 'Detective Inspector';
  if (total >= 550) return 'Detective Sergeant';
  if (total >= 300) return 'Detective Constable';
  return 'Rookie';
}
const MAX_SCORE = PTS.culprit + PTS.motive + 3 * PTS.perKey + PTS.discovery + PTS.timeline + 3 * PTS.perConn + PTS.efficiency;

/* ------------------------------------------------------------------ */
/* RENDER: chrome                                                       */
/* ------------------------------------------------------------------ */
function render() {
  document.documentElement.setAttribute('data-theme', S.theme);
  renderTop(); renderSide();
  const main = document.getElementById('main');
  document.getElementById('layout').classList.toggle('solo', S.view !== 'case');
  if (S.view !== 'case' || !C()) { main.innerHTML = viewLibrary(); return; }
  const c = C(), cs = CS();
  const views = { dashboard: viewDashboard, brief: viewBrief, suspects: viewSuspects, locations: viewLocations, interviews: viewInterviews, evidence: viewEvidence, clues: viewClues, timeline: viewTimeline, connections: viewConnections, notes: viewNotes, hints: viewHints, theory: viewTheory, verdict: viewVerdict, solution: viewSolution, score: viewScore };
  let sec = S.section;
  if (['verdict', 'solution', 'score'].includes(sec) && !cs.theory) sec = 'theory';
  if (sec === 'solution' && !cs.revealed) sec = 'verdict';
  main.innerHTML = (views[sec] || viewDashboard)(c, cs);
}

function renderTop() {
  const el = document.getElementById('topbar');
  const inCase = S.view === 'case' && C();
  let mid = '';
  if (inCase) {
    const c = C(), cs = CS(), p = progress(c, cs);
    mid = '<div class="case-chip"><span class="num">' + c.number + '</span><span class="ttl">' + esc(c.title) + '</span></div>' +
      '<div class="bar-right"><div class="mini-prog" title="Investigation ' + p + '%"><i style="width:' + p + '%"></i></div><span class="mono small">' + p + '%</span>';
  } else {
    mid = '<div class="case-chip"><span class="muted small">Case Library</span></div><div class="bar-right">';
  }
  el.innerHTML = '<button class="brand" data-act="library" aria-label="Back to the case library"><span class="brand-mark">CF</span>CaseFile</button>' + mid +
    '<span class="save" id="save">' + saveLabel() + '</span>' +
    (inCase ? '<button class="icon-btn" data-act="library">Library</button>' : '') +
    '<button class="icon-btn" data-act="theme" aria-label="Switch theme">' + (S.theme === 'dark' ? 'Lights on' : 'Lights off') + '</button></div>';
}

function renderSide() {
  const el = document.getElementById('side');
  if (S.view !== 'case' || !C()) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  const c = C(), cs = CS(), nc = newCounts(c, cs);
  let n = 0;
  el.innerHTML = GROUPS.map(g => '<div class="nav-group"><div class="label">' + g.label + '</div>' + g.items.map(it => {
    n++;
    const locked = it.gated && (!cs.theory || (it.id === 'solution' && !cs.revealed));
    const pip = nc[it.id] ? '<span class="pip" title="New to check">' + nc[it.id] + '</span>' : locked ? '<span class="lock" aria-label="locked">\u{1F512}︎</span>' : '';
    return '<button class="nav-btn' + (S.section === it.id ? ' on' : '') + (cs.visited[it.id] ? ' seen' : '') + '" data-act="go" data-id="' + it.id + '"' + (locked ? ' disabled' : '') + '><span class="n">' + String(n).padStart(2, '0') + '</span><span>' + it.label + '</span>' + pip + '</button>';
  }).join('') + '</div>').join('');
}

function head(title, sub) { return '<div class="sec-head"><h1>' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>'; }

/* ------------------------------------------------------------------ */
/* RENDER: views                                                        */
/* ------------------------------------------------------------------ */
function caseStatus(c) {
  const cs = S.cases[c.id];
  if (!cs) return 'new';
  return cs.theory ? 'closed' : 'open';
}
function viewLibrary() {
  const f = S.lib || (S.lib = { diff: 'all', status: 'all' });
  const closed = CASES.filter(c => caseStatus(c) === 'closed');
  const solved = closed.filter(c => scoreOf(c, S.cases[c.id]).solved === 'solved').length;
  const total = closed.reduce((a, c) => a + scoreOf(c, S.cases[c.id]).total, 0);
  const inProg = CASES.filter(c => caseStatus(c) === 'open').length;
  const chip = (group, val, label, n) => '<button class="pick' + (f[group] === val ? ' on' : '') + '" data-act="libf" data-g="' + group + '" data-id="' + val + '" aria-pressed="' + (f[group] === val) + '">' + label + (n != null ? '<span class="c">' + n + '</span>' : '') + '</button>';
  const diffs = ['Easy', 'Standard', 'Hard'];
  const shown = CASES.filter(c => (f.diff === 'all' || c.difficulty === f.diff) && (f.status === 'all' || caseStatus(c) === f.status));
  const filters = '<section class="stack"><div class="stats"><div class="stat"><span class="label">Cases solved</span><b>' + solved + '/' + CASES.length + '</b></div><div class="stat"><span class="label">In progress</span><b>' + inProg + '</b></div><div class="stat"><span class="label">Career score</span><b>' + total + '</b></div><div class="stat"><span class="label">Career rank</span><b style="font-size:16px;font-family:var(--f-body);font-weight:600;padding-top:6px">' + (closed.length ? rank(Math.round(total / closed.length)) : '—') + '</b></div></div>' +
    '<div class="row"><span class="label" style="min-width:74px">Difficulty</span><div class="picker">' + chip('diff', 'all', 'All', CASES.length) + diffs.map(d => chip('diff', d, d, CASES.filter(c => c.difficulty === d).length)).join('') + '</div></div>' +
    '<div class="row"><span class="label" style="min-width:74px">Status</span><div class="picker">' + chip('status', 'all', 'All') + chip('status', 'new', 'Not started') + chip('status', 'open', 'In progress') + chip('status', 'closed', 'Closed') + '</div></div></section>';
  const cards = shown.map(c => {
    const cs = S.cases[c.id];
    let status = 'Not started', stamp = '', btn = 'Open case', p = 0;
    if (cs) {
      p = progress(c, cs);
      if (cs.theory) { const sc = scoreOf(c, cs); status = 'Closed · ' + sc.total + ' pts · ' + rank(sc.total); stamp = sc.solved === 'solved' ? '<span class="stamp ok">Solved</span>' : sc.solved === 'partial' ? '<span class="stamp brass">Partial</span>' : '<span class="stamp">Unsolved</span>'; btn = 'Review file'; }
      else { status = 'In progress · ' + p + '% investigated'; btn = 'Continue'; }
    }
    const replayBtn = cs ? (ui.confirm === 'replay:' + c.id
      ? '<span class="confirm-row"><span class="small">Wipe all progress?</span><button class="btn sm" data-act="replay" data-id="' + c.id + '">Yes, replay</button><button class="btn sm ghost" data-act="cancel">Keep</button></span>'
      : '<button class="btn sm ghost" data-act="ask-replay" data-id="' + c.id + '">Replay case</button>') : '';
    return '<article class="folder"><span class="folder-tab">' + c.number + '</span>' + stamp +
      '<div class="folder-body"><div class="meta"><span class="tag">' + c.kind + '</span><span class="tag">' + c.difficulty + '</span></div>' +
      '<h2>' + esc(c.title) + '</h2><p>' + esc(c.tagline) + '</p>' +
      '<p class="small" style="color:var(--paper-muted)">' + esc(c.place) + ' · ' + esc(c.when) + '</p>' +
      '<div class="prog" aria-hidden="true"><i style="width:' + p + '%"></i></div><p class="small mono">' + status + '</p>' +
      '<div class="row"><button class="btn primary" data-act="open" data-id="' + c.id + '">' + btn + '</button>' + replayBtn + '</div></div></article>';
  }).join('');
  return '<section class="hero"><span class="label">Case Library · ' + CASES.length + ' open files</span><h1>CaseFile</h1>' +
    '<p>You are the detective. Pick a file, read the brief, search the scenes and question the suspects. When you’re sure, name the culprit and prove it.</p>' +
    '<div class="flow"><span>Choose case</span><span>Read brief</span><span>Investigate</span><span>Interview</span><span>Collect evidence</span><span>Build timeline</span><span>Connect clues</span><span>Submit theory</span><span>Solution</span><span>Score</span></div></section>' +
    filters +
    (shown.length ? '<section class="grid g3">' + cards + '</section>' : '<section class="panel"><p class="muted">No cases match these filters.</p></section>');
}

function viewDashboard(c, cs) {
  const p = progress(c, cs), nc = newCounts(c, cs);
  const ev = unlockedEvidence(c, cs).length;
  const remaining = FLOW.filter(s => !cs.visited[s]);
  let next;
  if (cs.theory) next = ['Your theory is in. See how you did.', 'verdict', 'View verdict'];
  else if (remaining.length) next = ['Next: ' + GROUPS.flatMap(g => g.items).find(i => i.id === remaining[0]).label.toLowerCase() + '. ' + SECTION_INFO[remaining[0]], remaining[0], 'Go'];
  else if (nc.locations + nc.interviews + nc.evidence > 0) next = ['There are still unsearched spots, unasked questions or unexamined exhibits.', nc.locations ? 'locations' : nc.interviews ? 'interviews' : 'evidence', 'Keep digging'];
  else next = ['You’ve worked every lead you have. Time to name the culprit.', 'theory', 'Submit theory'];
  const tiles = GROUPS.flatMap(g => g.items).filter(i => SECTION_INFO[i.id]).map(i => {
    const badge = nc[i.id] ? '<span class="tag red">' + nc[i.id] + ' new</span>' : cs.visited[i.id] ? '<span class="tag ok">Visited</span>' : '<span class="tag">Not yet</span>';
    return '<button class="tile" data-act="go" data-id="' + i.id + '"><div class="top"><h3>' + i.label + '</h3>' + badge + '</div><p>' + SECTION_INFO[i.id] + '</p></button>';
  }).join('');
  return '<div class="dash-head"><div class="sec-head"><span class="label">Case ' + c.number + ' · ' + c.kind + ' · ' + c.difficulty + '</span><h1>' + esc(c.title) + '</h1><p>' + esc(c.tagline) + '</p></div>' +
    (cs.theory ? '<span class="stamp">Case closed</span>' : '<span class="stamp brass">Open</span>') + '</div>' +
    '<section class="panel stack"><div class="big-prog"><div class="row" style="justify-content:space-between"><span class="label">Investigation progress</span><span class="mono">' + p + '%</span></div><div class="track"><i style="width:' + p + '%"></i></div>' +
    '<p class="small muted">' + (remaining.length ? remaining.length + ' of ' + FLOW.length + ' sections not yet visited.' : 'Every section visited.') + '</p></div>' +
    '<div class="stats"><div class="stat"><span class="label">Clues</span><b>' + cs.clues.length + '/' + totalClues(c) + '</b></div><div class="stat"><span class="label">Evidence</span><b>' + ev + '/' + c.evidence.length + '</b></div><div class="stat"><span class="label">Actions</span><b>' + cs.actions + '</b></div><div class="stat"><span class="label">Hints used</span><b>' + cs.hints + '/3</b></div></div></section>' +
    '<section class="panel next"><p>' + next[0] + '</p><button class="btn primary" data-act="go" data-id="' + next[1] + '">' + next[2] + '</button></section>' +
    '<section class="grid g3">' + tiles + '</section>';
}

function viewBrief(c) {
  const v = c.victim;
  return head('Case brief', esc(c.place) + ' · ' + esc(c.when)) +
    '<div class="brief-grid"><section class="prose">' + c.brief.map(p => '<p>' + esc(p) + '</p>').join('') +
    '<div class="panel"><span class="label">Known facts</span><ul class="facts" style="margin-top:10px">' + c.facts.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div></section>' +
    '<aside class="paper stack"><span class="label">' + esc(v.label || (c.kind === 'Theft' ? 'Stolen item' : 'Victim')) + '</span><h3>' + esc(v.name) + '</h3>' +
    '<dl class="dl">' + (v.age ? '<dt>Age</dt><dd>' + v.age + '</dd>' : '') + '<dt>Profile</dt><dd>' + esc(v.role) + '</dd><dt>Found</dt><dd>' + esc(v.found) + '</dd><dt>Finding</dt><dd>' + esc(v.cause) + '</dd><dt>Suspects</dt><dd>' + c.suspects.length + '</dd></dl>' +
    '<div><span class="stamp">' + c.number + '</span></div></aside></div>' +
    '<div class="row"><button class="btn primary" data-act="go" data-id="suspects">Meet the suspects</button><button class="btn" data-act="go" data-id="locations">Go to the scene</button></div>';
}

function nodeLabel(c, n) {
  const [k, id] = [n.slice(0, 1), n.slice(2)];
  if (k === 's') return c.suspects.find(s => s.id === id)?.name || id;
  if (k === 'l') return c.locations.find(l => l.id === id)?.name || id;
  if (k === 'c') return c.clues[id]?.title || id;
  if (k === 'e') return c.evidence.find(e => e.id === id)?.name || id;
  return n;
}

function viewSuspects(c, cs) {
  return head('Suspects', 'Everyone who could have done it. Motives are what the household knows, not what you’ve proved.') +
    '<section class="grid g2">' + c.suspects.map(s => {
      const links = cs.connections.filter(k => k.a === 's:' + s.id || k.b === 's:' + s.id).map(k => '<span class="tag brass">' + esc(nodeLabel(c, k.a === 's:' + s.id ? k.b : k.a)) + '</span>').join('');
      const qLeft = (c.interviews[s.id] || []).filter(q => !cs.asked[q.id] && has(cs, q.requires)).length;
      return '<article class="panel suspect"><div class="suspect-top"><div class="mug" aria-hidden="true">' + initials(s.name) + '</div><div><h3>' + esc(s.name) + '</h3><p class="small muted">' + s.age + ' · ' + esc(s.role) + '</p></div></div>' +
        '<div class="kv"><div><span class="label">Background</span><span>' + esc(s.background) + '</span></div><div><span class="label">Possible motive</span><span>' + esc(s.motive) + '</span></div><div><span class="label">Relationship to victim</span><span>' + esc(s.relation) + '</span></div><div><span class="label">Stated alibi</span><span>' + esc(s.alibi) + '</span></div></div>' +
        (links ? '<div class="stack"><span class="label">Your connections</span><div class="linked">' + links + '</div></div>' : '') +
        '<div class="row"><button class="btn sm" data-act="interview" data-id="' + s.id + '">Interview' + (qLeft ? ' (' + qLeft + ' open)' : '') + '</button></div></article>';
    }).join('') + '</section>';
}

function viewLocations(c, cs) {
  const cur = S.loc[c.id] || c.locations[0].id;
  const loc = c.locations.find(l => l.id === cur) || c.locations[0];
  const picker = c.locations.map(l => {
    const left = l.spots.filter(sp => !cs.searched[l.id + ':' + sp.id] && has(cs, sp.requires)).length;
    return '<button class="pick' + (l.id === loc.id ? ' on' : '') + '" data-act="loc" data-id="' + l.id + '">' + esc(l.name) + (left ? '<span class="c">' + left + ' to search</span>' : '') + '</button>';
  }).join('');
  const spots = loc.spots.map(sp => {
    const key = loc.id + ':' + sp.id;
    if (!has(cs, sp.requires)) return '<div class="spot"><div><h3 class="muted">Something here needs a lead first</h3><p class="small muted">Keep investigating elsewhere.</p></div><span class="tag">Locked</span></div>';
    if (cs.searched[key]) return '<div class="spot"><div><h3>' + esc(sp.label) + '</h3><p class="found">' + esc(sp.text) + '</p>' + (sp.clue ? '<span class="clue-chip">Clue · ' + esc(c.clues[sp.clue].title) + '</span>' : '') + '</div><span class="tag ok">Searched</span></div>';
    return '<div class="spot"><div><h3>' + esc(sp.label) + '</h3><p class="small muted">Not yet searched.</p></div><button class="btn sm primary" data-act="search" data-loc="' + loc.id + '" data-id="' + sp.id + '">Search</button></div>';
  }).join('');
  return head('Locations', 'Pick a place and search it. Some spots open up only when you have a reason to look.') +
    '<div class="picker">' + picker + '</div>' +
    '<section class="panel stack"><span class="label">Scene</span><h2 style="font-family:var(--f-display);font-weight:400;font-size:26px">' + esc(loc.name) + '</h2><p class="muted">' + esc(loc.desc) + '</p><div style="margin-top:8px">' + spots + '</div></section>';
}

function viewInterviews(c, cs) {
  const who = S.who[c.id] || c.suspects[0].id;
  const s = c.suspects.find(x => x.id === who) || c.suspects[0];
  const picker = c.suspects.map(x => {
    const left = (c.interviews[x.id] || []).filter(q => !cs.asked[q.id] && has(cs, q.requires)).length;
    return '<button class="pick' + (x.id === s.id ? ' on' : '') + '" data-act="who" data-id="' + x.id + '">' + esc(x.name) + (left ? '<span class="c">' + left + '</span>' : '') + '</button>';
  }).join('');
  const qs = c.interviews[s.id] || [];
  const asked = qs.filter(q => cs.asked[q.id]);
  const open = qs.filter(q => !cs.asked[q.id] && has(cs, q.requires));
  const hidden = qs.filter(q => !cs.asked[q.id] && !has(cs, q.requires)).length;
  const transcript = asked.length ? asked.map(q => '<div class="qa"><span class="q">Q. ' + esc(q.q) + '</span><p class="a">' + esc(q.a) + '</p>' + (q.clue ? '<span class="clue-chip" style="justify-self:start">Clue · ' + esc(c.clues[q.clue].title) + '</span>' : '') + '</div>').join('') : '<p class="muted">No questions asked yet.</p>';
  return head('Interviews', 'Question each suspect. New lines of questioning open when you find something to confront them with.') +
    '<div class="picker">' + picker + '</div>' +
    '<section class="panel stack"><div class="suspect-top"><div class="mug" aria-hidden="true">' + initials(s.name) + '</div><div><h2 style="font-size:20px">' + esc(s.name) + '</h2><p class="small muted">' + esc(s.role) + ' · Alibi: ' + esc(s.alibi) + '</p></div></div>' +
    '<div class="transcript" style="margin-top:8px">' + transcript + '</div>' +
    (open.length ? '<div class="stack" style="margin-top:6px"><span class="label">Ask</span>' + open.map(q => '<button class="qbtn' + (q.requires ? ' confront' : '') + '" data-act="ask" data-id="' + q.id + '"><span>' + esc(q.q) + '</span>' + (q.requires ? '<span class="tag red">New lead</span>' : '') + '</button>').join('') + '</div>' : '') +
    (hidden ? '<p class="small muted">' + hidden + ' more line' + (hidden > 1 ? 's' : '') + ' of questioning will open as you find evidence.</p>' : (!open.length ? '<p class="small muted">You’ve asked everything you can for now.</p>' : '')) +
    '</section>';
}

function viewEvidence(c, cs) {
  let n = 0;
  const items = c.evidence.map(e => {
    n++;
    const tagN = 'Exhibit ' + String(n).padStart(2, '0');
    if (!has(cs, e.requires)) return '<article class="panel exhibit locked"><span class="label">' + tagN + '</span><h3>Not yet recovered</h3><p class="small muted">Keep investigating. This exhibit becomes available once you uncover the right lead.</p><span class="tag">Locked</span></article>';
    const done = cs.examined[e.id];
    return '<article class="panel exhibit"><div class="row" style="justify-content:space-between"><span class="label">' + tagN + '</span><span class="tag ' + (e.kind === 'Digital' ? 'brass' : '') + '">' + e.kind + '</span></div><h3>' + esc(e.name) + '</h3><p class="small">' + esc(e.desc) + '</p>' +
      (e.detail ? (done ? '<div class="detail mono">' + esc(e.detail) + '</div>' + (e.clue ? '<span class="clue-chip" style="justify-self:start">Clue · ' + esc(c.clues[e.clue].title) + '</span>' : '')
        : '<div><button class="btn sm primary" data-act="examine" data-id="' + e.id + '">Examine</button></div>') : '') + '</article>';
  }).join('');
  const count = unlockedEvidence(c, cs).length;
  return head('Evidence', count + ' of ' + c.evidence.length + ' exhibits recovered. Examine each one closely.') + '<section class="grid g2">' + items + '</section>';
}

function viewClues(c, cs) {
  const found = cs.clues.map((id, i) => {
    const cl = c.clues[id];
    return '<article class="paper stack"><span class="slip-src">No. ' + String(i + 1).padStart(2, '0') + '</span><h3>' + esc(cl.title) + '</h3><p>' + esc(cl.text) + '</p>' +
      '<div><button class="btn sm" style="background:rgba(255,255,255,.35);border-color:rgba(107,92,58,.35);color:var(--paper-ink)" data-act="connect-from" data-id="c:' + id + '">Connect…</button></div></article>';
  }).join('');
  const missing = totalClues(c) - cs.clues.length;
  return head('Clues', cs.clues.length + ' found, ' + missing + ' still out there. Not every clue points at the culprit; some clear the innocent.') +
    (cs.clues.length ? '<section class="grid g2">' + found + '</section>' : '<section class="panel"><p class="muted">No clues yet. Search the locations, question the suspects and examine the evidence.</p><div class="row" style="margin-top:12px"><button class="btn primary" data-act="go" data-id="locations">Search a location</button></div></section>');
}

function viewTimeline(c, cs) {
  const ev = knownEvents(c, cs);
  const hidden = c.timeline.length - ev.length;
  return head('Timeline', 'Events in the order they happened. Statements are drawn as hollow markers. Flag anything that doesn’t add up.') +
    '<section class="panel"><div class="tl">' + ev.map(e => '<div class="tl-item' + (e.claim ? ' claim' : '') + (cs.flags[e.i] ? ' flagged' : '') + '"><span class="t">' + e.t + '</span><span class="tl-dot" aria-hidden="true"></span><div><p>' + esc(e.text) + '</p><span class="src">' + (e.claim ? 'Statement · ' : 'Source · ') + esc(e.src) + '</span></div>' +
      '<button class="flag-btn' + (cs.flags[e.i] ? ' on' : '') + '" data-act="flag" data-id="' + e.i + '" aria-pressed="' + !!cs.flags[e.i] + '">' + (cs.flags[e.i] ? 'Flagged' : 'Doesn’t add up') + '</button></div>').join('') + '</div>' +
    (hidden ? '<p class="small muted" style="margin-top:12px">' + hidden + ' more event' + (hidden > 1 ? 's' : '') + ' will appear as you find clues.</p>' : '<p class="small muted" style="margin-top:12px">Timeline complete.</p>') + '</section>';
}

function nodeOptions(c, cs) {
  const opts = [];
  c.suspects.forEach(s => opts.push(['s:' + s.id, 'Suspect · ' + s.name]));
  c.locations.forEach(l => opts.push(['l:' + l.id, 'Place · ' + l.name]));
  unlockedEvidence(c, cs).forEach(e => opts.push(['e:' + e.id, 'Exhibit · ' + e.name]));
  cs.clues.forEach(id => opts.push(['c:' + id, 'Clue · ' + c.clues[id].title]));
  return opts;
}
function viewConnections(c, cs) {
  const opts = nodeOptions(c, cs);
  const pre = ui.connectFrom || '';
  const sel = (id, v) => '<select id="' + id + '">' + '<option value="">Choose…</option>' + opts.map(o => '<option value="' + o[0] + '"' + (o[0] === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  // board
  const nodes = [...new Set([...c.suspects.map(s => 's:' + s.id), ...cs.connections.flatMap(k => [k.a, k.b])])];
  const W = 640, H = 420, cx = W / 2, cy = H / 2 - 4, rx = 230, ry = 150;
  const pos = {};
  nodes.forEach((n, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / nodes.length; pos[n] = [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  const colour = n => n[0] === 's' ? 'var(--red)' : n[0] === 'c' ? 'var(--paper)' : n[0] === 'e' ? 'var(--brass)' : 'var(--muted)';
  const short = s => s.length > 24 ? s.slice(0, 23) + '…' : s;
  const lines = cs.connections.map(k => { const [x1, y1] = pos[k.a], [x2, y2] = pos[k.b]; const mx = (x1 + x2) / 2 + (cy - (y1 + y2) / 2) * .12, my = (y1 + y2) / 2 + 14; return '<path class="string" d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '"/>' + (k.label ? '<text class="elabel" x="' + mx.toFixed(1) + '" y="' + (my - 4).toFixed(1) + '" text-anchor="middle">' + esc(short(k.label)) + '</text>' : ''); }).join('');
  const dots = nodes.map(n => { const [x, y] = pos[n]; const below = y >= cy; return '<circle class="node" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (n[0] === 's' ? 9 : 7) + '" fill="' + colour(n) + '"/><text class="nlabel" x="' + x.toFixed(1) + '" y="' + (below ? y + 24 : y - 15).toFixed(1) + '" text-anchor="middle">' + esc(short(nodeLabel(c, n))) + '</text>'; }).join('');
  const board = '<div class="board-wrap"><svg class="board" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Connection board with ' + cs.connections.length + ' strings">' + lines + dots + '</svg></div>';
  const list = cs.connections.length ? cs.connections.map((k, i) => '<div class="conn"><span>' + esc(nodeLabel(c, k.a)) + ' <span class="via">— ' + esc(k.label || 'linked to') + ' →</span> ' + esc(nodeLabel(c, k.b)) + '</span><button class="btn sm ghost" data-act="unconn" data-id="' + i + '">Remove</button></div>').join('') : '<p class="muted small">No strings pinned yet. Link a suspect to a clue that points at them.</p>';
  return head('Clue connections', 'Pin a string between any two things: a suspect and a clue, a clue and a place, an exhibit and an alibi. Strong links from the true culprit to the key evidence earn points.') +
    board +
    '<section class="panel stack"><span class="label">Pin a new string</span><div class="conn-form"><div class="field"><label class="label" for="conn-a">From</label>' + sel('conn-a', pre) + '</div><div class="field"><label class="label" for="conn-b">To</label>' + sel('conn-b', '') + '</div><div class="field"><label class="label" for="conn-l">Why</label><input id="conn-l" maxlength="40" placeholder="e.g. lied about time"></div><button class="btn primary" data-act="conn">Pin it</button></div><p class="small" id="conn-msg" style="color:var(--red)"></p></section>' +
    '<section class="stack"><span class="label">Your strings (' + cs.connections.length + ')</span><div class="conn-list">' + list + '</div></section>';
}

function viewNotes(c, cs) {
  return head('Investigation notes', 'Your notebook for this case. It saves as you type.') +
    '<label class="label" for="notes">Notebook · ' + c.number + '</label>' +
    '<textarea id="notes" class="notepad" placeholder="Who had the chance?\nWhose story has a gap in it?\nWhat would have to be true for each suspect to be guilty?">' + esc(cs.notes) + '</textarea>';
}

function viewHints(c, cs) {
  const items = c.hints.map((h, i) => {
    if (i < cs.hints) return '<article class="paper stack"><span class="slip-src">Hint ' + (i + 1) + '</span><p>' + esc(h) + '</p></article>';
    if (i === cs.hints && !cs.theory) {
      const conf = ui.confirm === 'hint';
      return '<article class="panel stack"><span class="label">Hint ' + (i + 1) + '</span>' + (conf
        ? '<div class="confirm-row"><span>Reveal this hint for −' + PTS.hint + ' points?</span><button class="btn sm primary" data-act="hint">Reveal</button><button class="btn sm ghost" data-act="cancel">Not yet</button></div>'
        : '<div><button class="btn" data-act="ask-hint">Reveal hint ' + (i + 1) + ' (−' + PTS.hint + ' pts)</button></div>') + '</article>';
    }
    return '<article class="panel exhibit locked"><span class="label">Hint ' + (i + 1) + '</span><p class="small muted">Reveal the earlier hint first.</p></article>';
  }).join('');
  return head('Hints', 'Stuck? Each hint nudges you in the right direction without giving away the answer. Each one costs ' + PTS.hint + ' points.') + '<section class="grid">' + items + '</section>';
}

function viewTheory(c, cs) {
  if (cs.theory) {
    const t = cs.theory;
    return head('Final theory', 'Submitted. Your answer is locked in.') +
      '<section class="paper stack"><span class="label">Your accusation</span><h3>' + esc(c.suspects.find(s => s.id === t.culprit).name) + '</h3><p><b>Motive:</b> ' + esc(c.motives.find(m => m.id === t.motive).label) + '</p>' +
      '<p><b>Key evidence:</b> ' + t.evidence.map(id => esc(c.clues[id].title)).join('; ') + '</p>' + (t.explain ? '<p><b>How it happened:</b> ' + esc(t.explain) + '</p>' : '') + '</section>' +
      '<div class="row"><button class="btn primary" data-act="go" data-id="verdict">See the verdict</button></div>';
  }
  const d = cs.draft, p = progress(c, cs);
  const culprits = c.suspects.map(s => '<label class="choice"><input type="radio" name="culprit" value="' + s.id + '"' + (d.culprit === s.id ? ' checked' : '') + '><span><b>' + esc(s.name) + '</b><br><span class="small muted">' + esc(s.role) + '</span></span></label>').join('');
  const motives = c.motives.map(m => '<label class="choice"><input type="radio" name="motive" value="' + m.id + '"' + (d.motive === m.id ? ' checked' : '') + '><span>' + esc(m.label) + '</span></label>').join('');
  const evs = cs.clues.length ? cs.clues.map(id => { const on = d.evidence.includes(id); return '<label class="choice' + (!on && d.evidence.length >= 3 ? ' dis' : '') + '"><input type="checkbox" name="ev" value="' + id + '"' + (on ? ' checked' : '') + (!on && d.evidence.length >= 3 ? ' disabled' : '') + '><span>' + esc(c.clues[id].title) + '</span></label>'; }).join('') : '<p class="muted small">You haven’t found any clues yet.</p>';
  const ready = d.culprit && d.motive && d.evidence.length > 0;
  const conf = ui.confirm === 'theory';
  return head('Final theory', 'Name the person responsible, why they did it, and the three clues that prove it best. You only get one submission.') +
    (p < 50 ? '<div class="warn">You’ve investigated ' + p + '% of the case. You can accuse now, but there may be evidence you haven’t seen.</div>' : '') +
    '<form id="theory-form" class="stack" style="gap:22px" onsubmit="return false">' +
    '<fieldset class="stack" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">1 · Who did it?</legend><div class="choice-grid">' + culprits + '</div></fieldset>' +
    '<fieldset class="stack" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">2 · Why?</legend><div class="choice-grid">' + motives + '</div></fieldset>' +
    '<fieldset class="stack" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">3 · Key evidence (choose up to 3) · <span id="ev-count">' + d.evidence.length + '</span>/3</legend><div class="choice-grid">' + evs + '</div></fieldset>' +
    '<div class="field"><label class="label" for="explain">4 · How did it happen? (optional)</label><textarea id="explain" rows="5" placeholder="Walk through the crime in your own words.">' + esc(d.explain) + '</textarea></div>' +
    '<div class="confirm-row">' + (conf
      ? '<span>This locks your answer. Submit?</span><button class="btn primary" data-act="submit">Submit theory</button><button class="btn ghost" data-act="cancel">Go back</button>'
      : '<button class="btn primary" data-act="ask-submit"' + (ready ? '' : ' disabled') + '>Submit theory</button><span class="small muted">' + (ready ? 'Ready when you are.' : 'Choose a suspect, a motive and at least one clue.') + '</span>') +
    '</div></form>';
}

function viewVerdict(c, cs) {
  const sc = scoreOf(c, cs), t = cs.theory;
  const stamp = sc.solved === 'solved' ? '<span class="stamp big ok anim">Case solved</span>' : sc.solved === 'partial' ? '<span class="stamp big brass anim">Partly solved</span>' : '<span class="stamp big anim">Wrong suspect</span>';
  const line = sc.solved === 'solved' ? 'You named the right person, the right motive, and backed it with the evidence.' : sc.solved === 'partial' ? 'You named the right person, but your motive or evidence doesn’t fully hold up.' : 'The person you accused didn’t do it. The real culprit is still free.';
  const mark = ok => ok ? '<span class="mark-ok">✓ Correct</span>' : '<span class="mark-no">✗ Wrong</span>';
  return head('Case verdict', c.number + ' · ' + esc(c.title)) +
    '<section class="panel verdict-head">' + stamp + '<p style="font-size:16px">' + line + '</p></section>' +
    '<section class="panel tbl-wrap"><table class="cmp"><thead><tr><th>Part of your theory</th><th>Your answer</th><th>Result</th></tr></thead><tbody>' +
    '<tr><td>Culprit</td><td>' + esc(c.suspects.find(s => s.id === t.culprit).name) + '</td><td>' + mark(sc.culprit) + '</td></tr>' +
    '<tr><td>Motive</td><td>' + esc(c.motives.find(m => m.id === t.motive).label) + '</td><td>' + mark(sc.motive) + '</td></tr>' +
    t.evidence.map((id, i) => { const ok = c.solution.keyClues.includes(id); return '<tr><td>Evidence ' + (i + 1) + '</td><td>' + esc(c.clues[id].title) + '</td><td>' + (ok ? '<span class="mark-ok">✓ Key evidence</span>' : '<span class="mark-no">✗ Doesn’t prove it</span>') + '</td></tr>'; }).join('') +
    '</tbody></table></section>' +
    '<div class="row"><button class="btn primary" data-act="reveal">' + (cs.revealed ? 'Read the solution' : 'Reveal the solution') + '</button><button class="btn" data-act="go" data-id="score">Detective score</button></div>';
}

function viewSolution(c, cs) {
  const sol = c.solution, who = c.suspects.find(s => s.id === sol.culprit);
  return head('Solution', 'What really happened at ' + esc(c.place) + '.') +
    '<section class="brief-grid"><div class="prose">' + sol.story.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>' +
    '<aside class="paper stack"><span class="label">Responsible</span><h3>' + esc(who.name) + '</h3><p>' + esc(who.role) + '</p><p><b>Motive:</b> ' + esc(c.motives.find(m => m.id === sol.motive).label) + '</p><div><span class="stamp">Charged</span></div></aside></section>' +
    '<section class="panel stack"><span class="label">How the clues prove it</span><div class="proof">' + sol.proof.map(pr => { const f = cs.clues.includes(pr.clue); return '<div class="proof-item"><span class="tag ' + (f ? 'ok' : '') + '">' + (f ? 'Found' : 'Missed') + '</span><div><b>' + esc(c.clues[pr.clue].title) + '.</b> ' + esc(pr.text) + '</div></div>'; }).join('') + '</div></section>' +
    '<div class="row"><button class="btn primary" data-act="go" data-id="score">See your score</button></div>';
}

function viewScore(c, cs) {
  const sc = scoreOf(c, cs);
  const row = (label, note, pts) => '<tr><td>' + label + '</td><td class="muted">' + note + '</td><td class="pts">' + (pts > 0 ? '+' : '') + pts + '</td></tr>';
  const conf = ui.confirm === 'replay:' + c.id;
  return head('Detective score', c.number + ' · ' + esc(c.title)) +
    '<section class="panel stack"><div class="score-total"><b>' + sc.total + '</b><span class="muted">of ' + MAX_SCORE + ' possible</span><span class="stamp brass">' + rank(sc.total) + '</span></div></section>' +
    '<section class="panel tbl-wrap"><table class="cmp"><thead><tr><th>Deduction</th><th>Detail</th><th class="pts">Points</th></tr></thead><tbody>' +
    row('Culprit', sc.culprit ? 'Correct' : 'Wrong person', sc.culprit) +
    row('Motive', sc.motive ? 'Correct' : 'Incorrect', sc.motive) +
    row('Key evidence', sc.keyHits + ' of your picks are key evidence', sc.evidence) +
    row('Clues discovered', cs.clues.length + ' of ' + totalClues(c), sc.discovery) +
    row('Timeline', sc.timeline ? 'You flagged the lie' : 'The key inconsistency wasn’t flagged', sc.timeline) +
    row('Connections', sc.goodConns + ' string' + (sc.goodConns === 1 ? '' : 's') + ' from the culprit to key evidence', sc.conns) +
    row('Efficiency', cs.actions + ' actions (par ' + c.par + ')', sc.efficiency) +
    row('Hints', cs.hints + ' used', sc.hints) +
    '<tr><td><b>Total</b></td><td></td><td class="pts"><b>' + sc.total + '</b></td></tr></tbody></table></section>' +
    '<div class="row">' + (conf
      ? '<span class="confirm-row"><span>Wipe this case and start again?</span><button class="btn primary" data-act="replay" data-id="' + c.id + '">Yes, replay</button><button class="btn ghost" data-act="cancel">Keep my file</button></span>'
      : '<button class="btn primary" data-act="ask-replay" data-id="' + c.id + '">Replay case</button>') +
    '<button class="btn" data-act="library">Choose another case</button></div>';
}

/* ------------------------------------------------------------------ */
/* EVENTS                                                               */
/* ------------------------------------------------------------------ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  const c = C(), cs = S.view === 'case' && c ? CS() : null;
  switch (a) {
    case 'library': S.view = 'library'; ui.confirm = null; save(); render(); window.scrollTo(0, 0); return;
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); render(); return;
    case 'open': openCase(id); return;
    case 'libf': (S.lib || (S.lib = { diff: 'all', status: 'all' }))[b.dataset.g] = id; save(); render(); return;
    case 'go': go(id); return;
    case 'cancel': ui.confirm = null; render(); return;
    case 'ask-replay': ui.confirm = 'replay:' + id; render(); return;
    case 'replay': ui.confirm = null; replay(id); return;
    case 'loc': S.loc[c.id] = id; save(); render(); return;
    case 'who': S.who[c.id] = id; save(); render(); return;
    case 'interview': S.who[c.id] = id; go('interviews'); return;
    case 'search': {
      const key = b.dataset.loc + ':' + id; if (cs.searched[key]) return;
      const sp = c.locations.find(l => l.id === b.dataset.loc).spots.find(x => x.id === id);
      cs.searched[key] = true; act(cs); discover(sp.clue); break;
    }
    case 'ask': {
      if (cs.asked[id]) return;
      const q = Object.values(c.interviews).flat().find(x => x.id === id);
      cs.asked[id] = true; act(cs); discover(q.clue); break;
    }
    case 'examine': {
      if (cs.examined[id]) return;
      const ev = c.evidence.find(x => x.id === id);
      cs.examined[id] = true; act(cs); discover(ev.clue); break;
    }
    case 'flag': cs.flags[id] = !cs.flags[id]; break;
    case 'connect-from': ui.connectFrom = id; go('connections'); return;
    case 'conn': {
      const A = document.getElementById('conn-a').value, B = document.getElementById('conn-b').value, L = document.getElementById('conn-l').value.trim();
      const msg = document.getElementById('conn-msg');
      if (!A || !B) { msg.textContent = 'Choose both ends of the string.'; return; }
      if (A === B) { msg.textContent = 'Pick two different things to connect.'; return; }
      if (cs.connections.some(k => (k.a === A && k.b === B) || (k.a === B && k.b === A))) { msg.textContent = 'Those two are already connected.'; return; }
      cs.connections.push({ a: A, b: B, label: L }); ui.connectFrom = null; toast('String pinned', nodeLabel(c, A) + ' → ' + nodeLabel(c, B), 'ev'); break;
    }
    case 'unconn': cs.connections.splice(+id, 1); break;
    case 'ask-hint': ui.confirm = 'hint'; render(); return;
    case 'hint': if (cs.hints < 3) cs.hints += 1; ui.confirm = null; break;
    case 'ask-submit': ui.confirm = 'theory'; render(); return;
    case 'submit': {
      const d = cs.draft; if (!(d.culprit && d.motive && d.evidence.length)) return;
      cs.theory = { culprit: d.culprit, motive: d.motive, evidence: d.evidence.slice(0, 3), explain: d.explain, at: Date.now() };
      ui.confirm = null; go('verdict'); return;
    }
    case 'reveal': cs.revealed = true; go('solution'); return;
    default: return;
  }
  save(); render();
});

document.addEventListener('change', e => {
  const f = e.target.closest('#theory-form'); if (!f || !C()) return;
  const d = CS().draft;
  if (e.target.name === 'culprit') d.culprit = e.target.value;
  if (e.target.name === 'motive') d.motive = e.target.value;
  if (e.target.name === 'ev') {
    const v = e.target.value;
    if (e.target.checked) { if (d.evidence.length < 3 && !d.evidence.includes(v)) d.evidence.push(v); }
    else d.evidence = d.evidence.filter(x => x !== v);
  }
  save();
  if (['culprit', 'motive', 'ev'].includes(e.target.name)) { const y = window.scrollY; render(); window.scrollTo(0, y); }
});
document.addEventListener('input', e => {
  if (!C()) return;
  if (e.target.id === 'notes') { CS().notes = e.target.value; save(); }
  if (e.target.id === 'explain') { CS().draft.explain = e.target.value; save(); }
});

/* ------------------------------------------------------------------ */
/* BOOT                                                                 */
/* ------------------------------------------------------------------ */
function start(data) {
  S = data && data.state ? data.state : load();
  if (S.view === 'case' && !C()) S.view = 'library';
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
